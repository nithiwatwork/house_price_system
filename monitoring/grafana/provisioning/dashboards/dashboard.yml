# ให้ Grafana โหลด dashboard จากไฟล์ในโฟลเดอร์นี้ตอนเปิดเครื่อง
# แบบนี้ dashboard จะอยู่ใน Git ไปพร้อมโค้ด ไม่ใช่ตั้งค่าด้วยมือแล้วหายตอนลบ container
apiVersion: 1
providers:
  - name: mlops
    orgId: 1
    folder: MLOps
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
