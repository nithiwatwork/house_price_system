services:
  # ==========================================
  # 1. Serving Service (FastAPI + Metrics)
  # ==========================================
  house-price-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house-price-api
    ports:
      - "8000:8000"
    environment:
      - SERVING_HOST=0.0.0.0
      - SERVING_PORT=8000
      - MODEL_PATH=/app/artifacts/serving_model/model.joblib
      - PREPROCESSOR_PATH=/app/artifacts/serving_model/preprocessor.joblib
      - MODEL_VERSION=v1.0.0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
      - ./serving:/app/serving
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - mlops-network

  # ==========================================
  # 2. Prometheus Monitoring & Alerting
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: house-price-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - house-price-api
    restart: unless-stopped
    networks:
      - mlops-network

  # ==========================================
  # 3. Grafana Dashboard & Visualization
  # ==========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: house-price-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mlops-network


  # ==========================================
  # 5. Airflow Database (Postgres)
  # ==========================================
  postgres-airflow:
    image: postgres:16
    container_name: house-price-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - mlops-network

  # ==========================================
  # 6. Airflow Init (Migrate DB & Folders)
  # ==========================================
  airflow-init:
    image: airflow_lab-apiserver:latest
    container_name: house-price-airflow-init
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://apiserver:8080/execution/
      AIRFLOW__API__SECRET_KEY: house-price-airflow-secret
      AIRFLOW__API_AUTH__JWT_SECRET: house-price-airflow-secret
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      ML_PROJECT_ROOT: /opt/airflow
      PYTHONPATH: /opt/airflow/dags:/opt/airflow
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./include:/opt/airflow/include
      - ./artifacts:/opt/airflow/artifacts
      - ./src:/opt/airflow/src
      - ./config:/opt/airflow/config
      - ./monitoring:/opt/airflow/monitoring
      - ./scripts:/opt/airflow/scripts
      - ./tests:/opt/airflow/tests
    user: "50000:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        mkdir -p /opt/airflow/include /opt/airflow/logs /opt/airflow/artifacts
        echo "Airflow Initialized Successfully"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - mlops-network
    restart: "no"

  # ==========================================
  # 7. Airflow Webserver / API Server (UI: 8082)
  # ==========================================
  apiserver:
    image: airflow_lab-apiserver:latest
    container_name: house-price-airflow-apiserver
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "50000:0"
    command: api-server
    ports:
      - "8082:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    networks:
      - mlops-network

  # ==========================================
  # 8. Airflow Scheduler
  # ==========================================
  scheduler:
    image: airflow_lab-scheduler:latest
    container_name: house-price-airflow-scheduler
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "50000:0"
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    networks:
      - mlops-network

  # ==========================================
  # 9. Airflow DAG Processor
  # ==========================================
  dag-processor:
    image: airflow_lab-dag-processor:latest
    container_name: house-price-airflow-dag-processor
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "50000:0"
    command: dag-processor
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    networks:
      - mlops-network

  # ==========================================
  # 10. Airflow Triggerer
  # ==========================================
  triggerer:
    image: airflow_lab-triggerer:latest
    container_name: house-price-airflow-triggerer
    environment: *airflow-env
    volumes: *airflow-volumes
    user: "50000:0"
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres-airflow:
        condition: service_healthy
    networks:
      - mlops-network

volumes:
  airflow-postgres-db:

networks:
  mlops-network:
    driver: bridge
