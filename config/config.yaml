data:
  raw_path: data/raw/thailand_homes_clean.csv
  processed_dir: data/processed
  train_path: data/processed/train.csv
  validation_path: data/processed/validation.csv
  test_path: data/processed/test.csv
  rejected_path: data/rejected/rejected_rows.csv
  manifest_path: data/processed/split_manifest.json
  target: price
  identifier_columns:
    - id
  categorical_columns:
    - zipcode

model:
  path: artifacts/serving_model/house_price_model.joblib
  test_size: 0.2
  random_state: 42

api:
  host: 0.0.0.0
  port: 8000
